display_information:
  name: Straker Translate
  description: Get high-quality translations of your files directly in Slack.
  background_color: "#17395c"
  long_description:
    "Straker Translate for Slack helps you streamline your translation tasks all in one place. Manage all of your translation projects without leaving your work environment.\r

    \r

    Users of the Straker LanguageCloud can use Straker Translate for Slack to:\r

    • Check job status\r

    • Receive a job summary\r

    • Request Translations (Submit Quote)\r

    • Approve a quote\r

    • Receive translated files\r

    • Translate your conversations in channels to other languages\r

    \r

    In addition, LanguageCloud admin users can utilize Straker Translate for Slack to:\r

    • Approve new signed-up users\r

    \r

    Install the Straker app to your Slack workspace, connect your LanguageCloud account and use Straker’s bot to ask about key events happening in your translation projects, all without having to leave the familiarity of Slack.\r

    \r

    About Straker\r

    - Straker provides next-generation language cloud solutions supported by a state-of-the-art technology stack and robust AI layers to boost productivity, reduce friction and move faster with a new holistic approach to translation and localization. \r

    - By combining technical innovation and linguistic expertise, Straker delivers effortless accuracy through cost-effective and scalable translation solutions to global clients."
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Straker Translate
    always_online: true
  shortcuts:
    - name: New Translation Job
      type: message
      callback_id: new_job
      description: Submit a new translation job
  slash_commands:
    - command: /straker
      url: <YOUR_DOMAIN>/slack/events
      description: Job Status, Daily Summary, Submit a New Job
      usage_hint: "[job reference], my jobs, new"
      should_escape: false
oauth_config:
  redirect_urls:
    - <YOUR_DOMAIN>/slack/oauth_redirect
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:join
      - chat:write
      - chat:write.public
      - commands
      - files:read
      - files:write
      - groups:history
      - im:history
      - mpim:history
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    request_url: <YOUR_DOMAIN>/slack/events
    bot_events:
      - app_home_opened
      - app_mention
      - app_uninstalled
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
    request_url: <YOUR_DOMAIN>/slack/events
    message_menu_options_url: <YOUR_DOMAIN>/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
