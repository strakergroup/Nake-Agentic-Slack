display_information:
  name: Straker
  description: The official Slack app for the Straker RAY platform.
  background_color: "#17395c"
  long_description: "The official Slack app for the Straker RAY platform.\r

    \r

    Straker is a technology-based localization solution that helps you manage multilingual content.\r

    \r

    Since 2010, Straker has been leading the way in blending human and machine intelligence to increase speed, reduce complexity and cost in translations.\r

    \r

    Install this app to your Slack workspace to connect to your DeltaRAY account and use Straker's RAY bot to ask about key events happening in your translation projects without leaving your work environment.\r

    \r

    Need more info? Find out about the Straker integration with Slack. There are plenty more exciting features coming soon!"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Straker
    always_online: true
  shortcuts:
    - name: New Translation Job
      type: message
      callback_id: new_job
      description: Submit a new translation job to DeltaRAY
  slash_commands:
    - command: /ray
      url: <YOUR_DOMAIN>/slack/events
      description: Get the status of a job
      usage_hint: "[TJ number]"
      should_escape: false
  unfurl_domains:
    - strakertranslations.com
oauth_config:
  redirect_urls:
    - <YOUR_DOMAIN>/slack/oauth_redirect
  scopes:
    bot:
      - channels:history
      - chat:write
      - chat:write.public
      - commands
      - files:read
      - groups:history
      - im:history
      - im:read
      - im:write
      - links:read
      - links:write
      - mpim:history
settings:
  event_subscriptions:
    request_url: <YOUR_DOMAIN>/slack/events
    bot_events:
      - app_home_opened
      - app_uninstalled
      - link_shared
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
    request_url: <YOUR_DOMAIN>/slack/events
    message_menu_options_url: <YOUR_DOMAIN>/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
