name: Typecheck

on:
  pull_request:
    branches:
      - master
      - uat
  push:
    branches:
      - master
      - uat

jobs:
  pyright:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pyright
        run: python -m pip install --upgrade pip pyright

      - name: Run Pyright
        run: pyright
